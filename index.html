<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>终末庭院</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #0a0a0d; overflow: hidden; width: 100%; height: 100%;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    body * { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
    canvas { display: block; touch-action: none; }
    #boot-loader {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      color: #c9a45c; background:
        radial-gradient(circle at 50% 42%, rgba(90,20,32,.2), transparent 32%),
        linear-gradient(#08080c, #030305);
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
      transition: opacity .48s ease, visibility .48s ease;
    }
    #boot-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-sigil { width: min(520px, 80vw); text-align: center; }
    .boot-mark {
      position: relative; width: 78px; height: 78px; margin: 0 auto 30px; transform: rotate(45deg);
      border: 1px solid #7a6540; box-shadow: inset 0 0 28px rgba(138,31,45,.4), 0 0 34px rgba(201,164,92,.08);
    }
    .boot-mark::before, .boot-mark::after { content: ""; position: absolute; background: #8a1f2d; }
    .boot-mark::before { width: 1px; height: 110px; left: 38px; top: -16px; }
    .boot-mark::after { height: 1px; width: 110px; top: 38px; left: -16px; }
    .boot-title { font-size: 42px; letter-spacing: 14px; color: #e8d6ad; text-indent: 14px; }
    .boot-sub { margin-top: 8px; font: 12px "Microsoft YaHei", sans-serif; letter-spacing: 7px; color: #80786c; }
    .boot-track { height: 2px; margin-top: 44px; background: #211e1a; overflow: hidden; }
    #boot-progress { width: 0; height: 100%; background: linear-gradient(90deg,#5a1420,#c9a45c,#f4ead2); transition: width .18s ease; }
    .boot-meta { display: flex; justify-content: space-between; margin-top: 12px; font: 14px "Microsoft YaHei", sans-serif; color: #918a7e; letter-spacing: 2px; }
    #viewport-advisory {
      position: fixed; inset: 0; z-index: 100; display: none; place-items: center; box-sizing: border-box;
      padding: 28px; color: #d8d4c8; text-align: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(138,31,45,.22), transparent 34%),
        linear-gradient(145deg, #0d0d13, #030305 72%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .viewport-card {
      position: relative; width: min(560px, calc(100vw - 56px)); box-sizing: border-box; padding: 48px 42px 42px;
      border: 1px solid #7a6540; border-radius: 10px; background: rgba(20,20,27,.96);
      box-shadow: 0 24px 80px rgba(0,0,0,.58), inset 0 0 0 5px #09090d;
    }
    .viewport-card::before, .viewport-card::after {
      content: ""; position: absolute; left: 28px; right: 28px; height: 1px;
      background: linear-gradient(90deg, transparent, #8a1f2d, transparent);
    }
    .viewport-card::before { top: 18px; }
    .viewport-card::after { bottom: 18px; }
    .viewport-emblem {
      position: relative; width: 52px; height: 52px; margin: 0 auto 28px; transform: rotate(45deg);
      border: 1px solid #c9a45c; box-shadow: inset 0 0 20px rgba(138,31,45,.42);
    }
    .viewport-emblem::before, .viewport-emblem::after {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201,164,92,.42);
    }
    .viewport-emblem::after { inset: 22px; background: #c03040; border: 0; }
    .viewport-kicker {
      margin: 0 0 10px; color: #c9a45c; font-size: 12px; font-weight: 700; letter-spacing: 5px;
    }
    .viewport-card h1 {
      margin: 0; color: #f4eedd; font: 34px "STKaiti", "KaiTi", "FangSong", serif; letter-spacing: 5px;
    }
    .viewport-lead { margin: 18px 0 8px; color: #e0d9c8; font-size: 18px; font-weight: 700; }
    .viewport-detail { margin: 0; color: #aaa8b1; font-size: 14px; line-height: 1.75; }
    .viewport-detail strong { color: #c9a45c; font-weight: 600; }
    @media (orientation: portrait), (max-width: 1279px), (max-height: 719px) {
      #viewport-advisory { display: grid; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-JBHP8A79.js"></script>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-sigil">
      <div class="boot-mark"></div>
      <div class="boot-title">终末庭院</div>
      <div class="boot-sub">TERMINUS GARDEN</div>
      <div class="boot-track"><div id="boot-progress"></div></div>
      <div class="boot-meta"><span>正在唤醒失落谱系</span><span id="boot-percent">0%</span></div>
    </div>
  </div>
  <section id="viewport-advisory" role="dialog" aria-modal="true" aria-labelledby="viewport-title">
    <div class="viewport-card">
      <div class="viewport-emblem" aria-hidden="true"></div>
      <p class="viewport-kicker">DISPLAY NOTICE</p>
      <h1 id="viewport-title">视野尚未展开</h1>
      <p class="viewport-lead">建议横屏或更高分辨率</p>
      <p class="viewport-detail">终末庭院需要至少 <strong>1280 × 720</strong> 的横向显示区域。</p>
    </div>
  </section>
</body>
</html>
