<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171713" />
  <title>终末庭院</title>
  <style>
    :root {
      --coal: #1e1c18;
      --coal-deep: #0c0d0c;
      --coal-soft: #343028;
      --parchment: #d2bd91;
      --parchment-light: #ead9b2;
      --parchment-shadow: #9d8056;
      --ink: #24211c;
      --ink-muted: #615642;
      --rust: #9b4434;
      --rust-deep: #622a21;
      --verdigris: #3f786e;
      --verdigris-light: #78aa9c;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--coal-deep);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(24px, 5vw, 72px);
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 24%, rgba(155, 68, 52, .24) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 68%, rgba(63, 120, 110, .16), transparent 27%),
        radial-gradient(circle at 50% 45%, #2a2821 0, #171713 54%, #090a09 100%);
      font-family: "STKaiti", "KaiTi", "FangSong", "Noto Serif SC", serif;
      transition: opacity .48s ease, visibility .48s ease;
      isolation: isolate;
    }

    #boot-loader::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .28;
      background:
        repeating-linear-gradient(104deg, transparent 0 19px, rgba(234, 217, 178, .04) 20px, transparent 21px 47px),
        repeating-linear-gradient(3deg, transparent 0 8px, rgba(0, 0, 0, .18) 9px, transparent 11px 31px);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    #boot-loader::after {
      content: "";
      position: absolute;
      inset: 18px;
      z-index: -1;
      border: 1px solid rgba(210, 189, 145, .16);
      clip-path: polygon(0 2%, 2% 0, 19% .5%, 31% 0, 48% .7%, 64% .2%, 83% .8%, 98% 0, 100% 3%, 99.5% 25%, 100% 48%, 99.4% 71%, 100% 98%, 97% 100%, 76% 99.5%, 55% 100%, 31% 99.3%, 2% 100%, 0 97%, .6% 74%, 0 52%, .5% 28%);
      pointer-events: none;
    }

    #boot-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-sigil {
      position: relative;
      width: min(680px, 88vw);
      padding: clamp(42px, 6vw, 70px) clamp(30px, 7vw, 78px) clamp(34px, 5vw, 54px);
      text-align: center;
      background:
        linear-gradient(83deg, transparent 0 8%, rgba(63, 48, 29, .08) 8.3%, transparent 8.7% 76%, rgba(74, 54, 28, .1) 76.4%, transparent 77%),
        repeating-linear-gradient(178deg, rgba(65, 45, 21, .035) 0 1px, transparent 1px 6px),
        linear-gradient(138deg, var(--parchment-light), var(--parchment) 57%, #bfa477);
      border: 3px solid var(--ink);
      box-shadow:
        13px 16px 0 rgba(0, 0, 0, .3),
        0 30px 90px rgba(0, 0, 0, .54),
        inset 0 0 44px rgba(83, 57, 26, .16);
      clip-path: polygon(.8% 3%, 4% .8%, 12% 1.7%, 22% .5%, 35% 1.2%, 48% .3%, 62% 1.5%, 75% .6%, 88% 1.4%, 98.8% .4%, 100% 9%, 99.2% 22%, 100% 36%, 99.3% 52%, 100% 68%, 99% 84%, 99.8% 98%, 91% 99.3%, 78% 98.5%, 65% 100%, 51% 98.8%, 38% 99.6%, 24% 98.4%, 11% 99.5%, .6% 98%, 1.3% 85%, .3% 72%, 1% 57%, .2% 41%, 1.2% 26%);
      filter: drop-shadow(0 0 1px rgba(234, 217, 178, .22));
      animation: boot-card-arrive .56s cubic-bezier(.19, 1, .22, 1) both;
    }

    .boot-sigil::before {
      content: "";
      position: absolute;
      inset: 10px 12px 12px 10px;
      border: 2px solid rgba(36, 33, 28, .58);
      clip-path: polygon(0 2%, 8% 0, 21% 1%, 34% 0, 47% 1.2%, 61% 0, 76% 1%, 90% 0, 100% 2%, 99% 19%, 100% 39%, 99% 58%, 100% 80%, 99% 100%, 82% 99%, 65% 100%, 48% 99%, 29% 100%, 1% 99%, 0 83%, 1% 62%, 0 42%, 1% 22%);
      pointer-events: none;
    }

    .boot-sigil::after {
      content: "";
      position: absolute;
      inset: 18px;
      opacity: .42;
      background:
        linear-gradient(101deg, transparent 13%, rgba(36, 33, 28, .25) 13.2%, transparent 13.6%),
        linear-gradient(174deg, transparent 23%, rgba(36, 33, 28, .17) 23.2%, transparent 23.5%),
        linear-gradient(87deg, transparent 82%, rgba(98, 42, 33, .22) 82.2%, transparent 82.6%);
      pointer-events: none;
    }

    .boot-heading,
    .boot-title,
    .boot-sub,
    .boot-omen,
    .boot-track,
    .boot-meta {
      position: relative;
      z-index: 1;
    }

    .boot-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 5vw, 38px);
      margin-bottom: 24px;
    }

    .boot-index {
      min-width: 92px;
      color: var(--rust-deep);
      font: 700 11px/1.4 "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .boot-index:first-child {
      text-align: right;
    }

    .boot-index:last-child {
      text-align: left;
    }

    .boot-mark {
      position: relative;
      flex: 0 0 auto;
      width: 84px;
      height: 88px;
      color: var(--parchment-light);
      background: var(--coal);
      border: 2px solid var(--rust-deep);
      clip-path: polygon(9% 4%, 48% 0, 91% 6%, 96% 43%, 88% 91%, 53% 100%, 12% 92%, 3% 51%);
      box-shadow: inset 0 0 0 5px var(--parchment-shadow), inset 0 0 0 7px var(--ink);
      transform: rotate(-1.5deg);
    }

    .boot-mark::before {
      content: "";
      position: absolute;
      left: 39px;
      top: 18px;
      width: 5px;
      height: 51px;
      background: var(--parchment-light);
      clip-path: polygon(37% 0, 100% 8%, 59% 38%, 91% 69%, 31% 100%, 0 72%, 42% 41%);
      transform: rotate(8deg);
    }

    .boot-mark::after {
      content: "";
      position: absolute;
      left: 21px;
      top: 29px;
      width: 41px;
      height: 30px;
      border-top: 4px solid var(--rust);
      border-bottom: 3px solid var(--verdigris-light);
      border-radius: 50%;
      transform: rotate(-7deg) skewX(-10deg);
    }

    .boot-title {
      color: var(--ink);
      font-size: clamp(38px, 6vw, 62px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: clamp(7px, 1.7vw, 18px);
      text-indent: clamp(7px, 1.7vw, 18px);
      text-shadow: 1px 1px 0 rgba(234, 217, 178, .5), 2px 2px 0 rgba(36, 33, 28, .14);
      transform: rotate(-.35deg);
    }

    .boot-sub {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 11px;
      color: var(--rust-deep);
      font: 800 clamp(10px, 1.3vw, 12px)/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: clamp(3px, .7vw, 7px);
    }

    .boot-sub::before,
    .boot-sub::after {
      content: "";
      flex: 1;
      height: 2px;
      background: var(--rust-deep);
      clip-path: polygon(0 35%, 19% 0, 41% 51%, 62% 9%, 82% 60%, 100% 27%, 100% 100%, 73% 68%, 49% 100%, 22% 55%, 0 88%);
      opacity: .8;
    }

    .boot-omen {
      margin: 28px 0 0;
      color: var(--ink-muted);
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 700;
      letter-spacing: 2px;
    }

    .boot-omen::before,
    .boot-omen::after {
      content: "×";
      display: inline-block;
      margin: 0 10px;
      color: var(--rust);
      font-family: Georgia, serif;
      transform: rotate(12deg);
    }

    .boot-track {
      height: 17px;
      margin-top: 34px;
      padding: 4px;
      overflow: hidden;
      background: var(--coal);
      border: 1px solid #080907;
      clip-path: polygon(0 14%, 3% 0, 15% 12%, 27% 0, 39% 11%, 51% 0, 66% 13%, 81% 0, 100% 11%, 99.4% 86%, 87% 100%, 72% 87%, 57% 100%, 42% 88%, 26% 100%, 11% 86%, 0 100%);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .55);
    }

    #boot-progress {
      position: relative;
      width: 0;
      height: 100%;
      background:
        repeating-linear-gradient(116deg, transparent 0 9px, rgba(234, 217, 178, .18) 10px 11px),
        linear-gradient(90deg, #28534c, var(--verdigris), var(--verdigris-light));
      box-shadow: 0 0 10px rgba(63, 120, 110, .45);
      transition: width .18s ease;
    }

    #boot-progress::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -2px;
      bottom: -3px;
      width: 5px;
      background: var(--parchment-light);
      box-shadow: -2px 0 0 var(--rust-deep);
      transform: rotate(5deg);
    }

    .boot-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-top: 12px;
      color: #4f4738;
      font: 700 13px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 1.5px;
      text-align: left;
    }

    #boot-percent {
      color: #285b53;
      font: 900 17px/1 Georgia, "Times New Roman", serif;
      letter-spacing: 1px;
    }

    #viewport-advisory {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      color: var(--ink);
      text-align: center;
      background:
        radial-gradient(circle at 22% 78%, rgba(63, 120, 110, .2), transparent 27%),
        radial-gradient(circle at 76% 18%, rgba(155, 68, 52, .22), transparent 24%),
        linear-gradient(143deg, #2c2922, #111210 66%, #090a09);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      isolation: isolate;
    }

    #viewport-advisory::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .27;
      background:
        repeating-linear-gradient(7deg, transparent 0 17px, rgba(234, 217, 178, .05) 18px, transparent 20px 42px),
        repeating-linear-gradient(101deg, transparent 0 31px, rgba(0, 0, 0, .22) 32px, transparent 34px 71px);
      pointer-events: none;
    }

    .viewport-card {
      position: relative;
      width: min(580px, calc(100vw - 48px));
      padding: clamp(42px, 7vw, 66px) clamp(28px, 7vw, 66px) clamp(38px, 6vw, 56px);
      background:
        linear-gradient(96deg, transparent 0 19%, rgba(85, 61, 31, .08) 19.4%, transparent 20% 84%, rgba(85, 61, 31, .07) 84.4%, transparent 85%),
        repeating-linear-gradient(177deg, rgba(36, 33, 28, .035) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, var(--parchment-light), var(--parchment) 62%, #b99d70);
      border: 3px solid var(--ink);
      clip-path: polygon(2% 2%, 14% .6%, 27% 1.5%, 42% .4%, 57% 1.4%, 72% .6%, 87% 1.6%, 98% .4%, 100% 14%, 99% 29%, 100% 46%, 99% 63%, 100% 79%, 98.5% 99%, 85% 98%, 71% 100%, 56% 98.6%, 40% 100%, 25% 98.5%, 10% 99.6%, .5% 97%, 1.4% 82%, .4% 65%, 1.3% 47%, .3% 30%);
      box-shadow: 14px 17px 0 rgba(0, 0, 0, .34), 0 28px 90px rgba(0, 0, 0, .62), inset 0 0 38px rgba(79, 54, 25, .18);
      filter: drop-shadow(0 0 1px rgba(234, 217, 178, .22));
      animation: advisory-arrive .45s cubic-bezier(.2, .9, .25, 1.18) both;
    }

    .viewport-card::before {
      content: "";
      position: absolute;
      inset: 11px 12px 12px 10px;
      border: 2px solid rgba(36, 33, 28, .62);
      clip-path: polygon(0 2%, 11% 0, 25% 1%, 39% 0, 52% 1%, 68% 0, 83% 1%, 100% 0, 99% 22%, 100% 44%, 99% 68%, 100% 100%, 80% 99%, 62% 100%, 44% 99%, 24% 100%, 0 99%, 1% 77%, 0 56%, 1% 34%);
      pointer-events: none;
    }

    .viewport-card::after {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 25px;
      height: 3px;
      opacity: .75;
      background: var(--rust-deep);
      clip-path: polygon(0 28%, 9% 0, 20% 53%, 33% 14%, 46% 68%, 59% 8%, 72% 54%, 86% 17%, 100% 61%, 100% 100%, 81% 76%, 61% 100%, 41% 78%, 19% 100%, 0 71%);
      pointer-events: none;
    }

    .viewport-emblem,
    .viewport-kicker,
    .viewport-card h1,
    .viewport-lead,
    .viewport-detail {
      position: relative;
      z-index: 1;
    }

    .viewport-emblem {
      width: 92px;
      height: 62px;
      margin: 0 auto 24px;
      color: var(--parchment-light);
      background: var(--coal);
      border: 3px solid var(--rust-deep);
      clip-path: polygon(3% 8%, 24% 1%, 48% 5%, 73% 0, 98% 9%, 94% 91%, 72% 98%, 48% 94%, 22% 100%, 0 89%);
      box-shadow: inset 0 0 0 4px var(--parchment-shadow);
      transform: rotate(-1deg);
    }

    .viewport-emblem::before {
      content: "";
      position: absolute;
      inset: 18px 19px;
      border-top: 4px solid var(--verdigris-light);
      border-bottom: 4px solid var(--verdigris-light);
      transform: skewX(-13deg) rotate(1deg);
    }

    .viewport-emblem::after {
      content: "";
      position: absolute;
      left: 40px;
      top: 14px;
      width: 9px;
      height: 34px;
      background: var(--rust);
      clip-path: polygon(24% 0, 100% 7%, 67% 42%, 98% 93%, 29% 100%, 0 57%);
    }

    .viewport-kicker {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 10px 4px;
      color: var(--parchment-light);
      background: var(--verdigris);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 3px;
      text-transform: uppercase;
      clip-path: polygon(2% 9%, 31% 0, 59% 8%, 100% 0, 97% 89%, 68% 100%, 39% 92%, 0 100%);
      transform: rotate(.6deg);
    }

    .viewport-card h1 {
      margin: 0;
      color: var(--ink);
      font: 900 clamp(32px, 8vw, 46px)/1.18 "STKaiti", "KaiTi", "FangSong", "Noto Serif SC", serif;
      letter-spacing: clamp(3px, 1.3vw, 8px);
      text-indent: clamp(3px, 1.3vw, 8px);
      text-shadow: 2px 2px 0 rgba(98, 42, 33, .15);
      transform: rotate(-.3deg);
    }

    .viewport-lead {
      margin: 20px 0 10px;
      color: var(--rust-deep);
      font-size: clamp(17px, 4vw, 21px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .viewport-detail {
      max-width: 420px;
      margin: 0 auto;
      color: #4c4437;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.85;
    }

    .viewport-detail strong {
      display: inline-block;
      margin: 0 2px;
      padding: 0 5px;
      color: #24534c;
      border-bottom: 2px solid var(--verdigris);
      font-weight: 900;
      line-height: 1.45;
      transform: rotate(-1deg);
    }

    @keyframes boot-card-arrive {
      from { opacity: 0; transform: translateY(18px) rotate(.8deg) scale(.97); }
      to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }

    @keyframes advisory-arrive {
      from { opacity: 0; transform: translateY(12px) rotate(-1deg) scale(.96); }
      to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }

    @media (orientation: portrait), (max-width: 1279px), (max-height: 719px) {
      #viewport-advisory {
        display: grid;
      }
    }

    @media (max-width: 560px), (max-height: 560px) {
      #viewport-advisory {
        padding: 16px;
      }

      .viewport-card {
        width: min(580px, calc(100vw - 24px));
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .viewport-emblem {
        width: 78px;
        height: 54px;
        margin-bottom: 16px;
      }

      .viewport-emblem::before {
        inset: 15px 17px;
      }

      .viewport-emblem::after {
        left: 34px;
        top: 11px;
        height: 32px;
      }

      .viewport-lead {
        margin-top: 14px;
      }
    }

    @media (max-height: 440px) {
      .viewport-card {
        padding: 22px 28px 26px;
      }

      .viewport-card::after {
        bottom: 14px;
      }

      .viewport-emblem {
        display: none;
      }

      .viewport-kicker {
        margin-bottom: 6px;
      }

      .viewport-card h1 {
        font-size: 30px;
      }

      .viewport-lead {
        margin: 8px 0 4px;
        font-size: 15px;
      }

      .viewport-detail {
        font-size: 12px;
        line-height: 1.55;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-sigil,
      .viewport-card {
        animation: none;
      }

      #boot-loader,
      #boot-progress {
        transition: none;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-B4z5ED4c.js"></script>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-sigil" aria-live="polite">
      <div class="boot-heading" aria-hidden="true">
        <span class="boot-index">弃庭档案</span>
        <div class="boot-mark"></div>
        <span class="boot-index">第零卷</span>
      </div>
      <div class="boot-title">终末庭院</div>
      <div class="boot-sub"><span>TERMINUS GARDEN</span></div>
      <p class="boot-omen">每一次坠落，都会留下新的路</p>
      <div class="boot-track" aria-hidden="true"><div id="boot-progress"></div></div>
      <div class="boot-meta"><span>正在翻检褪色的命运牌……</span><span id="boot-percent">0%</span></div>
    </div>
  </div>

  <section id="viewport-advisory" role="dialog" aria-modal="true" aria-labelledby="viewport-title">
    <div class="viewport-card">
      <div class="viewport-emblem" aria-hidden="true"></div>
      <p class="viewport-kicker">VIEWPORT CHECK · 04</p>
      <h1 id="viewport-title">牌桌太窄了</h1>
      <p class="viewport-lead">请横放屏幕，或扩大窗口</p>
      <p class="viewport-detail">完整战场需要至少 <strong>1280 × 720</strong> 的横向显示区域。尺寸合适后，这张提示牌会自动收起。</p>
    </div>
  </section>

</body>
</html>
